name: Prepare HTML and CSS Practical Repository
on:
  push:
    paths:
      - ".github/workflows/import-labs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and personalize reference practicals
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ayushiujh-source/BCS352-HTML-CSS-LAB-AYUSHI.git /tmp/reference
          rsync -a --exclude='.git' /tmp/reference/ ./
          python - <<'PY'
          from pathlib import Path
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              s2 = s.replace("Java_Lab_File_Ayushi.pdf", "Java_Lab_File_Riddhi_Gupta.pdf")
              s2 = s2.replace("Ayushi", "Riddhi Gupta").replace("BCS2025414", "BCS2025468")
              if s2 != s:
                  p.write_text(s2, encoding="utf-8")
          PY
      - name: Verify 15 HTML and CSS lab folders
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type d -name 'Lab*' | wc -l)" -eq 15
          test "$(find . -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 15
          test "$(find . -mindepth 2 -maxdepth 2 -name style.css | wc -l)" -eq 15
          ! grep -R -n -I -E 'Ayushi|BCS2025414' --exclude-dir=.git .
          echo "Verified: 15 labs, 15 HTML pages and 15 CSS files."
      - name: Remove one-time importer and push prepared files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-labs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare HTML and CSS practicals for Riddhi Gupta"
          git push
